name: Build and publish APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Restore development signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.PIXELTOUCH_DEBUG_KEYSTORE }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/pixeltouch-debug.keystore"

      - name: Build APK
        env:
          PIXELTOUCH_DEBUG_KEYSTORE: ${{ runner.temp }}/pixeltouch-debug.keystore
        run: gradle :app:assembleDebug

      - name: Prepare release asset
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/PixelTouch.apk

      - name: Read version
        id: version
        run: |
          echo "code=$(jq -r '.elements[0].versionCode' app/build/outputs/apk/debug/output-metadata.json)" >> "$GITHUB_OUTPUT"
          echo "name=$(jq -r '.elements[0].versionName' app/build/outputs/apk/debug/output-metadata.json)" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.code }}
          name: PixelTouch ${{ steps.version.outputs.name }}
          files: app/build/outputs/apk/debug/PixelTouch.apk
          generate_release_notes: true
          overwrite_files: true
