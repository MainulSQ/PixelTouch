name: Build and publish APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.41.6"

      - name: Restore development signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.PIXELTOUCH_DEBUG_KEYSTORE }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/pixeltouch-debug.keystore"

      - name: Build APK
        env:
          PIXELTOUCH_DEBUG_KEYSTORE: ${{ runner.temp }}/pixeltouch-debug.keystore
        run: flutter build apk --debug

      - name: Prepare release asset
        run: cp build/app/outputs/flutter-apk/app-debug.apk build/app/outputs/flutter-apk/PixelTouch.apk

      - name: Read version
        id: version
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          echo "name=${VERSION%%+*}" >> "$GITHUB_OUTPUT"
          echo "code=${VERSION##*+}" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.version.outputs.code }}
          NAME: PixelTouch ${{ steps.version.outputs.name }}
          APK: build/app/outputs/flutter-apk/PixelTouch.apk
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --title "$NAME" --draft=false
          else
            gh release create "$TAG" "$APK" --repo "$GITHUB_REPOSITORY" --title "$NAME" --generate-notes
          fi
